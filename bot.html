<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The meta tag below ensures that the page is displayed correctly on all screen sizes -->
  <meta charset="UTF-8"> <!-- This defines the character encoding as UTF-8 for better support of different characters -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- This ensures responsive design on mobile devices -->
  <title>Gorge</title> <!-- Title of the webpage (it will be shown on the browser tab) -->
  <link rel="stylesheet" href="bot.css"> <!-- Linking an external CSS file (bot.css) to style the page -->
</head>
<body>
  <div class="container"> <!-- A container div to hold the chat interface -->
    <h1>Gorge</h1> <!-- Main heading of the page (e.g., your chatbot's name) -->
    
    <!-- This is where the chat messages will be displayed -->
    <div id="chatbox"></div> 
    
    <!-- Input field for the user to type their message -->
    <input type="text" placeholder="Write your message here" id="messageInput"> 
    
    <!-- Send button that the user will click to send the message -->
    <button id="sendBtn">Send</button> 
  </div>
</body>
<!-- This script includes an external JavaScript file (bot.js) that will handle chat interactions -->
<script src="bot.js"></script> 
</html>
